<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 - STYLEBOX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="result">
    <div class="icon wait" id="resultIcon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="resultTitle">결제를 승인하고 있습니다...</h1>
    <p class="desc" id="resultDesc">잠시만 기다려 주세요.</p>

    <dl class="result-table">
      <div><dt>주문번호</dt><dd id="rOrderId">-</dd></div>
      <div><dt>주문상품</dt><dd id="rOrderName">-</dd></div>
      <div><dt>결제수단</dt><dd id="rMethod">-</dd></div>
      <div><dt>결제금액</dt><dd id="rAmount">-</dd></div>
      <div><dt>결제키</dt><dd id="rPaymentKey" style="font-weight:400;font-size:12px">-</dd></div>
    </dl>

    <div class="btn-row">
      <a href="index.html" class="btn">홈으로</a>
      <a href="index.html" class="btn primary">쇼핑 계속하기</a>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/success.js"></script>
</body>
</html>
