<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - STYLEBOX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="auth">
    <div class="tabs auth-tabs" id="authTabs">
      <button type="button" class="chip active" data-tab="login">로그인</button>
      <button type="button" class="chip" data-tab="signup">회원가입</button>
    </div>

    <form id="authForm" novalidate>
      <div class="field" data-only="signup" hidden>
        <label for="authName">이름</label>
        <input class="input" id="authName" autocomplete="name" placeholder="홍길동">
      </div>
      <div class="field">
        <label for="authEmail">이메일</label>
        <input class="input" id="authEmail" type="email" autocomplete="email" placeholder="example@email.com">
      </div>
      <div class="field">
        <label for="authPassword">비밀번호</label>
        <input class="input" id="authPassword" type="password" autocomplete="current-password" placeholder="6자 이상">
      </div>
      <div class="field" data-only="signup" hidden>
        <label for="authPassword2">비밀번호 확인</label>
        <input class="input" id="authPassword2" type="password" autocomplete="new-password">
      </div>
      <p class="auth-msg" id="authMsg" role="status" hidden></p>
      <button type="submit" class="btn primary" id="authSubmit">로그인</button>
      <button type="button" class="link-btn" id="resendBtn" hidden>확인 메일 다시 보내기</button>
    </form>

    <div class="social">
      <p class="social-label">간편 로그인</p>
      <button type="button" class="btn social-btn kakao" data-provider="kakao">카카오로 시작하기</button>
      <button type="button" class="btn social-btn google" data-provider="google">Google로 시작하기</button>
    </div>

    <p class="auth-foot">비회원으로 주문하셨나요? <a href="orders.html">비회원 주문 조회</a></p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
